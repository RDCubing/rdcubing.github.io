<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Geek Devs Comm</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial;
      background: #0f0f10;
      color: white;
    }

    .header {
      padding: 40px;
    }

    .header h1 {
      font-weight: 300;
      font-size: 48px;
      margin: 0;
    }

    .header p {
      color: #aaa;
      margin-top: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 20px 40px 40px;
    }

    .tile {
      background: #1a1a1a;
      padding: 20px;
      min-height: 120px;
      display: flex;
      align-items: flex-end;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .tile:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }

    .large {
      grid-column: span 2;
      grid-row: span 2;
      font-size: 28px;
    }

    .blue { background: #0078d7; }
    .green { background: #107c10; }
    .purple { background: #5c2d91; }
    .red { background: #d13438; }
    .yellow { background: #f2c811; color: black; }
    .pink { background: #e81123; }

    .footer {
      padding: 20px 40px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>Geek Devs Comm</h1>
  <p>Build • Share • Innovate</p>
</div>

<div class="grid" id="appGrid">
</div>

<div class="footer">
  © 2026 Geek Devs Comm
</div>

<script>
var apiUrl =
"https://github.com/RDCubing/geekhubapi/raw/refs/heads/main/projects.json";

function createTile(app, large)
{
    var tile = document.createElement("div");

    tile.className =
        "tile " +
        (large ? "large blue" : "purple");

    tile.innerHTML = app.Title;

    tile.onclick = function()
    {
        window.open(app.DownloadUrl, "_blank");
    };

    return tile;
}

function loadApps()
{
    var xhr = new XMLHttpRequest();

    xhr.onreadystatechange = function()
    {
        if (xhr.readyState === 4 && xhr.status === 200)
        {
            var data = JSON.parse(xhr.responseText);
            var grid = document.getElementById("appGrid");

            var count = 0;

            function addApps(list)
            {
                for (var i = 0; i < list.length; i++)
                {
                    var app = list[i];

                    if (app.TopApp === "Yes")
                    {
                        count++;

                        grid.appendChild(
                            createTile(
                                app,
                                count <= 2
                            )
                        );
                    }
                }
            }

            addApps(data.NeonStore);

            if (data.OtherPlatforms)
            {
                addApps(data.OtherPlatforms);
            }
        }
    };

    xhr.open("GET", apiUrl, true);
    xhr.send();
}

loadApps();
</script>

</body>
</html>
