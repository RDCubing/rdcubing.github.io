<script>


/*
 * API endpoints
 */

const NEWS_URL =
    "https://raw.githubusercontent.com/RDCubing/gdcr-news-reimp2026/main/news/news.json";


const NEWS_IMAGE_URL =
    "https://raw.githubusercontent.com/RDCubing/gdcr-news-reimp2026/main/news/images/";


const COMMENTS_URL =
    "https://gdcr.dankassassin368.com/ns-status/comments";


/*
 * Comments per page
 */

const COMMENTS_PER_PAGE = 5;


/*
 * Elements
 */

const article =
    document.getElementById("article");


const latestNews =
    document.getElementById("latestNews");


/*
 * Current article
 */

let currentNews = null;


/*
 * Comments
 */

let commentsData = [];

let currentCommentPage = 1;


/*
 * Escape HTML
 */

function escapeHtml(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/*
 * Parse YYYYMMDD-HHMM
 */

function parseNewsDate(newsId) {

    if (
        !newsId ||
        !/^\d{8}-\d{4}$/.test(newsId)
    ) {
        return null;
    }


    const year =
        Number(
            newsId.substring(0, 4)
        );


    const month =
        Number(
            newsId.substring(4, 6)
        ) - 1;


    const day =
        Number(
            newsId.substring(6, 8)
        );


    const hour =
        Number(
            newsId.substring(9, 11)
        );


    const minute =
        Number(
            newsId.substring(11, 13)
        );


    return new Date(
        year,
        month,
        day,
        hour,
        minute
    );

}


/*
 * Format news date
 */

function formatNewsDate(newsId) {

    const date =
        parseNewsDate(newsId);


    if (!date) {
        return newsId;
    }


    return date.toLocaleString(
        undefined,
        {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/*
 * Format comment timestamp
 */

function formatCommentDate(timestamp) {

    if (!timestamp) {
        return "";
    }


    const date =
        new Date(timestamp);


    if (isNaN(date.getTime())) {
        return timestamp;
    }


    return date.toLocaleString(
        undefined,
        {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/*
 * Get news ID from URL
 *
 * /news/news.html?id=20260811-0830
 */

const params =
    new URLSearchParams(
        window.location.search
    );


const newsId =
    params.get("id");


/*
 * Load article
 */

if (!newsId) {

    article.innerHTML = `

        <h1>
            News
        </h1>

        <div class="box">

            <p>
                No news article was specified.
            </p>

            <a class="button"
               href="/news/">
                Back to News
            </a>

        </div>

    `;

}


/*
 * Fetch article
 */

else {

    fetch(NEWS_URL)

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to load news."
            );

        }

        return response.json();

    })

    .then(data => {

        const item =
            data.find(
                news =>
                    String(news.newsId) ===
                    String(newsId)
            );


        /*
         * Article not found
         */

        if (!item) {

            article.innerHTML = `

                <h1>
                    News Article Not Found
                </h1>

                <div class="box">

                    <p>
                        The requested news article
                        could not be found.
                    </p>

                    <a class="button"
                       href="/news/">
                        Back to News
                    </a>

                </div>

            `;

            return;

        }


        currentNews = item;


        document.title =
            item.title +
            " - Geek Devs Community";


        const imageUrl =
            NEWS_IMAGE_URL +
            encodeURIComponent(
                item.newsId
            ) +
            ".png";


        article.innerHTML = `

            <h1>
                ${escapeHtml(item.title)}
            </h1>

            <div class="box">

                <img
                    src="${imageUrl}"
                    alt="${escapeHtml(item.title)}"
                    style="
                        width: 100%;
                        max-width: 1000px;
                        height: auto;
                        display: block;
                        margin-bottom: 20px;
                    "
                    onerror="
                        this.style.display='none';
                    "
                >

                <p>

                    <b>
                        ${escapeHtml(item.author)}
                    </b>

                    &nbsp;|&nbsp;

                    ${escapeHtml(
                        formatNewsDate(
                            item.newsId
                        )
                    )}

                </p>

                <hr>

                <p>

                    <b>
                        ${escapeHtml(
                            item.description
                        )}
                    </b>

                </p>

                <p>
                    ${escapeHtml(
                        item.content
                    )}
                </p>

            </div>


            <br>


            <a class="button"
               href="/news/">
                ← Back to News
            </a>


            <h2 id="comments">
                Comments
            </h2>


            <div id="commentFormContainer">

            </div>


            <div id="commentsContainer">

                Loading comments...

            </div>


            <div id="commentPagination"
                 style="margin-top: 20px;">

            </div>

        `;


        setupCommentForm();

        loadComments();

    })

    .catch(error => {

        console.error(error);


        article.innerHTML = `

            <h1>
                Unable to Load News
            </h1>

            <div class="box">

                <p>
                    The news service could not be reached.
                </p>

                <a class="button"
                   href="/news/">
                    Back to News
                </a>

                </div>

        `;

    });

}


/*
 * Setup comment form
 */

function setupCommentForm() {

    const container =
        document.getElementById(
            "commentFormContainer"
        );


    if (!container) {
        return;
    }


    const token =
        localStorage.getItem("token");


    const username =
        localStorage.getItem("username");


    /*
     * Not signed in
     */

    if (!token || !username) {

        container.innerHTML = `

            <div class="box">

                <p>
                    You must be signed in to
                    leave a comment.
                </p>

                <a class="button"
                   href="/account/">
                    Sign In
                </a>

            </div>

            <br>

        `;

        return;

    }


    /*
     * Signed in
     */

    container.innerHTML = `

        <div class="box">

            <p>

                Commenting as:

                <b>
                    ${escapeHtml(username)}
                </b>

            </p>


            <label for="commentText">
                Comment
            </label>

            <br><br>


            <textarea
                id="commentText"
                rows="5"
                style="
                    width: 100%;
                    max-width: 700px;
                    box-sizing: border-box;
                "
                placeholder="Write a comment..."
            ></textarea>


            <br><br>


            <button
                class="button"
                id="postCommentButton">

                Post Comment

            </button>


            <div id="commentMessage"
                 style="margin-top: 10px;">

            </div>

        </div>

        <br>

    `;


    document
        .getElementById("postCommentButton")
        .addEventListener(
            "click",
            postComment
        );

}


/*
 * Post comment
 */

async function postComment() {

    const token =
        localStorage.getItem("token");


    const username =
        localStorage.getItem("username");


    const textarea =
        document.getElementById(
            "commentText"
        );


    const message =
        document.getElementById(
            "commentMessage"
        );


    if (!token || !username) {

        message.textContent =
            "Please sign in first.";

        return;

    }


    const comment =
        textarea.value.trim();


    if (!comment) {

        message.textContent =
            "Please enter a comment.";

        return;

    }


    message.textContent =
        "Posting comment...";


    try {

        const response =
            await fetch(
                COMMENTS_URL,
                {
                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body: JSON.stringify({

                        newsId:
                            currentNews.newsId,

                        username:
                            username,

                        comment:
                            comment

                    })

                }
            );


        let data = null;


        try {

            data =
                await response.json();

        }
        catch (e) {

            data = null;

        }


        if (!response.ok) {

            message.textContent =
                (
                    data &&
                    data.error
                ) ||
                "Unable to post comment.";

            return;

        }


        textarea.value = "";


        message.textContent =
            "Comment posted successfully.";


        /*
         * Reload comments so the
         * new comment appears.
         */

        await loadComments();

    }
    catch (error) {

        console.error(error);


        message.textContent =
            "Unable to connect to the server.";

    }

}


/*
 * Load comments
 */

async function loadComments() {

    const commentsContainer =
        document.getElementById("commentsContainer");

    if (!commentsContainer) {
        return;
    }

    commentsContainer.textContent =
        "Loading comments...";

    const url =
        COMMENTS_URL +
        "?newsId=" +
        encodeURIComponent(currentNews.newsId);

    console.log("Loading comments from:", url);

    try {

        const response =
            await fetch(url, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            });

        console.log(
            "Comments response:",
            response.status,
            response.statusText
        );

        const text =
            await response.text();

        console.log(
            "Comments response body:",
            text
        );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                text
            );

        }

        let data;

        try {

            data = JSON.parse(text);

        }
        catch (error) {

            throw new Error(
                "Server did not return valid JSON."
            );

        }

        if (!Array.isArray(data)) {

            throw new Error(
                "Comments response is not an array."
            );

        }

        commentsData = data;

        commentsData.sort(
            (a, b) => {

                return new Date(
                    b.timestamp
                ) -
                new Date(
                    a.timestamp
                );

            }
        );

        currentCommentPage = 1;

        displayComments(1);

    }
    catch (error) {

        console.error(
            "Comments error:",
            error
        );

        commentsContainer.innerHTML = `

            <div class="box">

                <p>
                    Unable to load comments.
                </p>

                <p>
                    <b>Error:</b>
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;

    }

}


/*
 * Display comments
 */

function displayComments(page) {

    const commentsContainer =
        document.getElementById(
            "commentsContainer"
        );


    const commentPagination =
        document.getElementById(
            "commentPagination"
        );


    if (!commentsContainer) {
        return;
    }


    currentCommentPage =
        page;


    commentsContainer.innerHTML = "";


    const start =
        (page - 1) *
        COMMENTS_PER_PAGE;


    const end =
        start +
        COMMENTS_PER_PAGE;


    const pageComments =
        commentsData.slice(
            start,
            end
        );


    /*
     * No comments
     */

    if (pageComments.length === 0) {

        commentsContainer.innerHTML = `

            <div class="box">

                <p>
                    No comments yet.
                </p>

            </div>

        `;

        createCommentPagination();

        return;

    }


    /*
     * Create comments
     */

    pageComments.forEach(
        comment => {

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "box";


            box.style.marginBottom =
                "15px";


            box.innerHTML = `

                <p>

                    <b>
                        ${escapeHtml(
                            comment.username
                        )}
                    </b>

                    &nbsp;|&nbsp;

                    ${escapeHtml(
                        formatCommentDate(
                            comment.timestamp
                        )
                    )}

                </p>


                <hr>


                <p>
                    ${escapeHtml(
                        comment.comment
                    )}
                </p>

            `;


            commentsContainer.appendChild(
                box
            );

        }
    );


    createCommentPagination();

}


/*
 * Comment pagination
 */

function createCommentPagination() {

    const commentPagination =
        document.getElementById(
            "commentPagination"
        );


    if (!commentPagination) {
        return;
    }


    commentPagination.innerHTML =
        "";


    const totalPages =
        Math.ceil(
            commentsData.length /
            COMMENTS_PER_PAGE
        );


    if (totalPages <= 1) {
        return;
    }


    const wrapper =
        document.createElement(
            "div"
        );


    /*
     * Previous
     */

    if (currentCommentPage > 1) {

        const previous =
            document.createElement(
                "button"
            );


        previous.className =
            "button";


        previous.textContent =
            "Previous";


        previous.style.marginRight =
            "5px";


        previous.addEventListener(
            "click",
            () => {

                displayComments(
                    currentCommentPage - 1
                );

            }
        );


        wrapper.appendChild(
            previous
        );

    }


    /*
     * Page numbers
     */

    for (
        let page = 1;
        page <= totalPages;
        page++
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "button";


        button.textContent =
            page;


        button.style.marginRight =
            "5px";


        if (
            page ===
            currentCommentPage
        ) {

            button.disabled =
                true;

        }


        button.addEventListener(
            "click",
            () => {

                displayComments(
                    page
                );


                document
                    .getElementById(
                        "comments"
                    )
                    .scrollIntoView({
                        behavior:
                            "smooth"
                    });

            }
        );


        wrapper.appendChild(
            button
        );

    }


    /*
     * Next
     */

    if (
        currentCommentPage <
        totalPages
    ) {

        const next =
            document.createElement(
                "button"
            );


        next.className =
            "button";


        next.textContent =
            "Next";


        next.addEventListener(
            "click",
            () => {

                displayComments(
                    currentCommentPage + 1
                );


                document
                    .getElementById(
                        "comments"
                    )
                    .scrollIntoView({
                        behavior:
                            "smooth"
                    });

            }
        );


        wrapper.appendChild(
            next
        );

    }


    commentPagination.appendChild(
        wrapper
    );

}


/*
 * Load latest news sidebar
 */

fetch(NEWS_URL)

.then(response => {

    if (!response.ok) {

        throw new Error(
            "Unable to load news."
        );

    }

    return response.json();

})

.then(data => {

    data.sort(
        (a, b) =>
            String(b.newsId)
                .localeCompare(
                    String(a.newsId)
                )
    );


    latestNews.innerHTML = "";


    data
        .slice(0, 5)
        .forEach(item => {

            const entry =
                document.createElement(
                    "div"
                );


            entry.className =
                "announcement-item";


            entry.innerHTML = `

                <div class="announcement-title">

                    <a href="/news/news.html?id=${encodeURIComponent(item.newsId)}">

                        ${escapeHtml(
                            item.title
                        )}

                    </a>

                </div>


                <div class="announcement-date">

                    ${escapeHtml(
                        formatNewsDate(
                            item.newsId
                        )
                    )}

                </div>

            `;


            latestNews.appendChild(
                entry
            );

        });

})

.catch(() => {

    latestNews.textContent =
        "Unable to load news.";

});


</script>
