<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geek Devs Community - App</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link id="theme-style" rel="stylesheet" href="../css/webstore/app/classic.css">


</head>



<body>



<div class="header">

Geek Devs Community

<span>| WebStore</span>

</div>




<div class="nav">
    <a href="https://rdcubing.github.io">Home</a>
    <a href="https://rdcubing.github.io/webstore">WebStore</a>
	<a href="https://rdcubing.github.io/webstore/apps">All Apps</a>
	<a href="https://rdcubing.github.io/downloads">Downloads</a>
    <a target="_blank" href="https://discord.gg/YBsVhkcHT4">Discord</a>
    <a href="https://rdcubing.github.io/services">Services</a>
	<a target="_blank" href="https://github.com/RDCubing">GitHub</a>
</div>




<div class="container">

    <div class="sidebar">
	<h3>Settings</h3>

    <select id="themeSelector">
        <option value="classic">Classic</option>
        <!-- <option value="standard">Standard</option> -->
        <option value="luna">Luna</option>
    </select>

        <h3>Application</h3>

        <a href="#details">Details</a>
        <a href="#description">Description</a>
        <a href="#information">Information</a>

        <h3 style="margin-top:24px;">Resources</h3>

        <a href="https://rdcubing.github.io/webstore">WebStore Home</a>
        <a href="https://rdcubing.github.io/webstore/apps">All Applications</a>
        <a href="https://rdcubing.github.io/downloads">Downloads</a>
        <a href="https://github.com/RDCubing" target="_blank">GitHub</a>

    </div>

    <div class="content">

        <div id="app">
            Loading application...
        </div>

    </div>

</div>




<div class="footer">

© 2026 Geek Devs Community<br>

NeonStore WebStore

</div>




<script src="../js/theme.js"></script>
<script>

const apiUrl =
"https://raw.githubusercontent.com/RDCubing/geekhubapi/main/projects.json";

const params =
new URLSearchParams(window.location.search);

const appId =
params.get("id");

function showApp(app)
{
    document.title =
        app.Title + " - Geek Devs Community WebStore";

    document.getElementById("app").innerHTML = `

<h1 id="details">
${app.Title}
</h1>

<div class="panel">

<div class="app-header">

<img class="app-icon"
src="${app.ImagePath}"
alt="${app.Title}">

<div>

<div class="title">
${app.Title}
</div>

<div class="subtitle">
${app.Publisher}
<br>
${app.Subtitle}
</div>

<a class="button"
href="${app.DownloadUrl}"
target="_blank">

Download

</a>

</div>

</div>

</div>

<h2 id="description">
Description
</h2>

<div class="panel">

${app.Description || "No description available."}

</div>

<h2 id="information">
Information
</h2>

<div class="panel">

<b>Publisher:</b>
${app.Publisher}

<br><br>

<b>Platform:</b>
${app.Platform || "Unknown"}

<br><br>

<b>Version:</b>
${app.Version || "Unknown"}

</div>

`;
}

fetch(apiUrl)

.then(response => response.json())

.then(data => {

    const apps = [
        ...(data.NeonStore || []),
        ...(data.OtherPlatforms || [])
    ];

    const app =
        apps.find(a => a.Id === appId);

    if (app) {

        showApp(app);

    } else {

        document.getElementById("app").innerHTML = `

<h1>Application Not Found</h1>

<p>
The requested application could not be found.
</p>

`;

    }

})

.catch(() => {

    document.getElementById("app").innerHTML = `

<h1>Error</h1>

<p>
Unable to load application information.
</p>

`;

});

</script>



</body>

</html>
