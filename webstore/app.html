<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geek Devs Community - App</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>

* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;
    background: #c0c0c0;
    overflow-x: hidden;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #c0c0c0;
    color: #000;
    font: 13px Tahoma, Arial, sans-serif;
}

/* Header */

.header {
    position: relative;
    overflow: hidden;
    padding: 18px 40px;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    background: linear-gradient(to right, #000080 0%, #1084d0 100%);
    border-bottom: 2px solid #404040;
}

.header::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 128px;
    height: 128px;
    background: url("8BackgroundNew.png") center/cover no-repeat;
    pointer-events: none;
}

.header span {
    font-size: 18px;
    font-weight: normal;
}

/* Navigation */

.nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 40px;
    background: #d4d0c8;
    border-top: 1px solid #fff;
    border-bottom: 2px solid #808080;
}

.nav a {
    display: inline-block;
    padding: 4px 8px;
    color: #000080;
    text-decoration: none;
    border: 1px solid transparent;
    white-space: nowrap;
}

.nav a:hover {
    background: #0a246a;
    color: #fff;
    border-color: #000080;
}

/* Layout */

.container {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 15px;
    display: flex;
    gap: 25px;
}

.sidebar {
    width: 220px;
    flex-shrink: 0;
    background: #d4d0c8;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 15px;
    height: fit-content;
}

.sidebar h3 {
    margin: 0;
    color: #000080;
}

.sidebar h3 + a {
    margin-top: 8px;
}

.sidebar a {
    display: block;
    padding: 5px 0;
    color: #000080;
    text-decoration: none;
    word-break: break-word;
}

.sidebar a:hover {
    text-decoration: underline;
}

.content {
    flex: 1;
    min-width: 0;
}

/* Typography */

h1 {
    color: #000080;
    font-size: 30px;
    font-weight: normal;
    margin-top: 0;
}

h2 {
    color: #000;
    font-size: 20px;
    margin-top: 35px;
    padding-bottom: 5px;
    border-bottom: 1px solid #808080;
}

/* Panels */

.panel {
    margin-top: 20px;
    padding: 20px;
    background: #d4d0c8;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
}

/* Application Header */

.app-header {
    display: flex;
    align-items: center;
    gap: 20px;
}

.app-icon {
    width: 96px;
    height: 96px;
    object-fit: contain;
    flex-shrink: 0;
}

.title {
    color: #000080;
    font-size: 24px;
    font-weight: bold;
}

.subtitle {
    color: #666;
    font-size: 12px;
    margin-top: 4px;
    line-height: 1.5;
}

/* Buttons */

.button {
    display: inline-block;
    margin-top: 15px;
    padding: 6px 18px;
    color: #000;
    text-decoration: none;
    background: #d4d0c8;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
}

.button:hover {
    background: #e8e8e8;
}

.button:active {
    border-color: #808080 #fff #fff #808080;
}

/* Footer */

.footer {
    margin-top: auto;
    padding: 15px 40px;
    font-size: 12px;
    color: #444;
    background: #d4d0c8;
    border-top: 2px solid #808080;
}

/* ---------------- Tablet ---------------- */

@media (max-width:768px) {

    .header {
        padding: 15px 20px;
        font-size: 22px;
    }

    .header::after {
        width: 96px;
        height: 96px;
    }

    .header span {
        display: block;
        margin-top: 4px;
        font-size: 15px;
    }

    .nav {
        padding: 10px 20px;
        justify-content: flex-start;
    }

    .nav a {
        margin: 0;
    }

    .container {
        flex-direction: column;
        gap: 20px;
        margin: 20px auto;
    }

    .sidebar,
    .content {
        width: 100%;
    }

    h1 {
        font-size: 26px;
    }

    h2 {
        font-size: 18px;
    }

    .app-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .app-icon {
        width: 80px;
        height: 80px;
    }

    .title {
        font-size: 22px;
    }

    .button {
        display: block;
        text-align: center;
    }

    .footer {
        padding: 15px 20px;
    }
}

/* ---------------- Phones ---------------- */

@media (max-width:480px) {

    .header {
        padding: 12px 15px;
        font-size: 20px;
    }

    .header::after {
        width: 72px;
        height: 72px;
    }

    .header span {
        font-size: 14px;
    }

    .nav {
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        padding: 10px 15px;
    }

    .nav a {
        display: block;
        text-align: center;
        padding: 8px;
    }

    .container {
        margin: 15px auto;
        padding: 0 10px;
        gap: 15px;
    }

    .sidebar,
    .panel {
        padding: 12px;
    }

    h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 17px;
    }

    .title {
        font-size: 20px;
    }

    .subtitle {
        font-size: 13px;
    }

    .app-icon {
        width: 64px;
        height: 64px;
    }

    .button {
        display: block;
        text-align: center;
        padding: 8px;
    }

    .footer {
        padding: 15px;
        text-align: center;
    }
}



</style>

</head>



<body>



<div class="header">

Geek Devs Community

<span>| WebStore</span>

</div>




<div class="nav">
    <a href="https://rdcubing.github.io">Home</a>
    <a href="https://rdcubing.github.io/webstore">WebStore</a>
	<a href="https://rdcubing.github.io/webstore/apps">All Apps</a>
	<a href="https://rdcubing.github.io/downloads">Downloads</a>
    <a target="_blank" href="https://discord.gg/YBsVhkcHT4">Discord</a>
    <a href="https://rdcubing.github.io/services">Services</a>
	<a target="_blank" href="https://github.com/RDCubing">GitHub</a>
</div>




<div class="container">

    <div class="sidebar">

        <h3>Application</h3>

        <a href="#details">Details</a>
        <a href="#description">Description</a>
        <a href="#information">Information</a>

        <h3 style="margin-top:24px;">Resources</h3>

        <a href="https://rdcubing.github.io/webstore">WebStore Home</a>
        <a href="https://rdcubing.github.io/webstore/apps">All Applications</a>
        <a href="https://rdcubing.github.io/downloads">Downloads</a>
        <a href="https://github.com/RDCubing" target="_blank">GitHub</a>

    </div>

    <div class="content">

        <div id="app">
            Loading application...
        </div>

    </div>

</div>




<div class="footer">

© 2026 Geek Devs Community<br>

NeonStore WebStore

</div>





<script>

const apiUrl =
"https://raw.githubusercontent.com/RDCubing/geekhubapi/main/projects.json";

const params =
new URLSearchParams(window.location.search);

const appId =
params.get("id");

function showApp(app)
{
    document.title =
        app.Title + " - Geek Devs Community WebStore";

    document.getElementById("app").innerHTML = `

<h1 id="details">
${app.Title}
</h1>

<div class="panel">

<div class="app-header">

<img class="app-icon"
src="${app.ImagePath}"
alt="${app.Title}">

<div>

<div class="title">
${app.Title}
</div>

<div class="subtitle">
${app.Publisher}
<br>
${app.Subtitle}
</div>

<a class="button"
href="${app.DownloadUrl}"
target="_blank">

Download

</a>

</div>

</div>

</div>

<h2 id="description">
Description
</h2>

<div class="panel">

${app.Description || "No description available."}

</div>

<h2 id="information">
Information
</h2>

<div class="panel">

<b>Publisher:</b>
${app.Publisher}

<br><br>

<b>Platform:</b>
${app.Platform || "Unknown"}

<br><br>

<b>Version:</b>
${app.Version || "Unknown"}

</div>

`;
}

fetch(apiUrl)

.then(response => response.json())

.then(data => {

    const apps = [
        ...(data.NeonStore || []),
        ...(data.OtherPlatforms || [])
    ];

    const app =
        apps.find(a => a.Id === appId);

    if (app) {

        showApp(app);

    } else {

        document.getElementById("app").innerHTML = `

<h1>Application Not Found</h1>

<p>
The requested application could not be found.
</p>

`;

    }

})

.catch(() => {

    document.getElementById("app").innerHTML = `

<h1>Error</h1>

<p>
Unable to load application information.
</p>

`;

});

</script>



</body>

</html>
