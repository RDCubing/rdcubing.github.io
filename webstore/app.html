<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geek Devs Community - App</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    background: white;
    color: #333;
    font-family: Tahoma, Arial, sans-serif;
}

/* Header */

.header {
    position: relative;
    background: #005a9e;
    color: white;
    padding: 18px 40px;
    font-size: 28px;
    font-weight: bold;
    overflow: hidden;
}

.header::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 128px;
    height: 128px;
    background: url("8BackgroundNew.png") no-repeat center;
    background-size: cover;
    pointer-events: none;
}

.header span {
    font-size: 18px;
    font-weight: normal;
}

/* Navigation */

.nav {
    background: #eeeeee;
    border-bottom: 1px solid #ccc;
    padding: 10px 40px;
}

.nav a {
    color: #0066cc;
    text-decoration: none;
    margin-right: 25px;
    font-size: 14px;
}

/* Layout */

.page {
    max-width: 900px;
    width: 100%;
    margin: 30px auto;
    padding: 0 15px;
}

/* Typography */

h1 {
    color: #005a9e;
    font-size: 30px;
    font-weight: normal;
}

h2 {
    color: #333;
    font-size: 20px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 5px;
    margin-top: 35px;
}

/* Panels */

.panel {
    background: #f5f5f5;
    border: 1px solid #ccc;
    padding: 20px;
    margin-top: 20px;
}

/* Application Header */

.app-header {
    display: flex;
    align-items: center;
    gap: 20px;
}

.app-icon {
    width: 96px;
    height: 96px;
    object-fit: contain;
    flex-shrink: 0;
}

.title {
    color: #005a9e;
    font-size: 24px;
    font-weight: bold;
}

.subtitle {
    color: #777;
    font-size: 13px;
    margin-top: 4px;
}

/* Buttons */

.button {
    display: inline-block;
    background: #0078d7;
    color: white;
    padding: 8px 18px;
    text-decoration: none;
    margin-top: 15px;
    font-size: 14px;
}

.button:hover {
    background: #006cc1;
}

/* Footer */

.footer {
    margin-top: 40px;
    background: #eeeeee;
    border-top: 1px solid #ccc;
    padding: 15px 40px;
    font-size: 12px;
    color: #666;
}

/* Mobile */

@media (max-width: 768px) {

    .header {
        padding: 15px 20px;
        font-size: 22px;
    }

    .header::after {
        width: 96px;
        height: 96px;
    }

    .header span {
        display: block;
        margin-top: 5px;
        font-size: 15px;
    }

    .nav {
        padding: 10px 20px;
    }

    .nav a {
        display: inline-block;
        margin-right: 15px;
        margin-bottom: 8px;
    }

    .page {
        margin-top: 20px;
        padding: 0 15px;
    }

    h1 {
        font-size: 26px;
    }

    h2 {
        font-size: 18px;
    }

    .app-header {
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
    }

    .app-icon {
        width: 80px;
        height: 80px;
        margin: 0;
    }

    .title {
        font-size: 22px;
    }

    .button {
        display: block;
        text-align: center;
    }
}

@media (max-width: 400px) {

    .header {
        font-size: 20px;
    }

    .page {
        padding: 10px;
    }

    .title {
        font-size: 20px;
    }
}



</style>

</head>



<body>



<div class="header">

Geek Devs Community

<span>| WebStore</span>

</div>




<div class="nav">
    <a href="https://rdcubing.github.io">Home</a>
    <a href="https://rdcubing.github.io/webstore">WebStore</a>
	<a href="https://rdcubing.github.io/webstore">All Apps</a>
	<a href="https://rdcubing.github.io/downloads">Downloads</a>
    <a target="_blank" href="https://discord.gg/YBsVhkcHT4">Discord</a>
    <a href="https://rdcubing.github.io/services">Services</a>
	<a target="_blank" href="https://github.com/RDCubing">GitHub</a>
</div>




<div class="page">


<div id="app">

Loading application...

</div>



</div>




<div class="footer">

© 2026 Geek Devs Community<br>

NeonStore WebStore

</div>





<script>


const apiUrl =
"https://raw.githubusercontent.com/RDCubing/geekhubapi/main/projects.json";



const params =
new URLSearchParams(window.location.search);



const appId =
params.get("id");





function showApp(app)
{


document.title =
app.Title + " - Geek Devs WebStore";



document.getElementById("app").innerHTML = `


<h1>
${app.Title}
</h1>



<div class="panel">


<div class="app-header">


<img class="app-icon"
src="${app.ImagePath}">


<div>


<div class="title">

${app.Title}

</div>



<div class="subtitle">

${app.Publisher}

<br>

${app.Subtitle}

</div>



<a class="button"
href="${app.DownloadUrl}"
target="_blank">

Download

</a>



</div>


</div>


</div>





<h2>
Description
</h2>



<div class="panel">


${app.Description || 
"No description available."}


</div>





<h2>
Information
</h2>



<div class="panel">


<b>Publisher:</b>

${app.Publisher}


<br><br>


<b>Platform:</b>

${app.Platform || "Unknown"}


<br><br>


<b>Version:</b>

${app.Version || "Unknown"}


</div>



`;



}





fetch(apiUrl)

.then(r=>r.json())

.then(data=>{


let apps = [];


apps =
apps.concat(data.NeonStore || []);

apps =
apps.concat(data.OtherPlatforms || []);




let app =
apps.find(x=>x.Id == appId);



if(app)

{

showApp(app);

}

else

{

document.getElementById("app").innerHTML =

`

<h1>
Application Not Found
</h1>


<p>
The requested application could not be found.
</p>

`;

}



})

.catch(()=>{


document.getElementById("app").innerHTML =

`

<h1>
Error
</h1>


<p>
Unable to load application information.
</p>

`;

});



</script>



</body>

</html>
