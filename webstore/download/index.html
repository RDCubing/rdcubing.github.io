<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geek Devs Community - Downloads</title>

<style>

* {
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    overflow-x:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:white;
    color:#333;
}

.header {
    position: relative;
    background: #005a9e;
    color: white;
    padding: 18px 40px;
    font-size: 28px;
    font-weight: bold;
    overflow: hidden;
}

.header::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 128px;
    height: 128px;
    background: url("8BackgroundNew.png") no-repeat center;
    background-size: cover;
    pointer-events: none;
}

.header span{
    font-size:18px;
    font-weight:normal;
}

.nav{
    background:#eee;
    border-bottom:1px solid #ccc;
    padding:10px 40px;
}

.nav a{
    color:#0066cc;
    text-decoration:none;
    margin-right:25px;
    font-size:14px;
}

.page{
    max-width:900px;
    margin:30px auto;
    padding:0 15px;
}

h1{
    color:#005a9e;
    font-size:30px;
    font-weight:normal;
}

h2{
    color:#333;
    border-bottom:1px solid #ccc;
    padding-bottom:5px;
    margin-top:35px;
}

.panel{
    background:#f5f5f5;
    border:1px solid #ccc;
    padding:20px;
    margin-top:20px;
}

.download {
    display: flex;
    gap: 20px;
    align-items: center;
}

.icon-box {
    width: 96px;
    height: 96px;
    background: #0F4C4C; /* Solid blue */
    border: 1px solid #005a9e;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.icon-box img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}

.button{
    display:inline-block;
    background:#0078d7;
    color:white;
    text-decoration:none;
    padding:10px 22px;
    margin-top:15px;
}

.button:hover{
    background:#006cc1;
}

.footer{
    margin-top:40px;
    background:#eee;
    border-top:1px solid #ccc;
    padding:15px 40px;
    font-size:12px;
    color:#666;
}

@media(max-width:768px){

.header {
        padding: 15px 20px;
        font-size: 22px;
    }

    .header::after {
        width: 96px;
        height: 96px;
    }

    .header span {
        display: block;
        margin-top: 5px;
        font-size: 15px;
    }

.nav{
    padding:10px 20px;
}

.nav a{
    display:inline-block;
    margin-bottom:8px;
    margin-right:15px;
}

.icon-box {
    width: 80px;
    height: 80px;
    background: #0F4C4C;
    border: 1px solid #005a9e;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.icon-box img {
    width: 68px;
    height: 68px;
    object-fit: contain;
}

.button{
    display:block;
    text-align:center;
}

.footer{
    padding:15px 20px;
}

}

</style>

</head>
<body>

<div class="header">
Geek Devs Community
<span>| Downloads</span>
</div>

<div class="nav">
    <a href="https://rdcubing.github.io">Home</a>
    <a href="https://rdcubing.github.io/webstore">WebStore</a>
	<a href="https://rdcubing.github.io/downloads">Downloads</a>
    <a target="_blank" href="https://discord.gg/YBsVhkcHT4">Discord</a>
    <a href="https://rdcubing.github.io/services">Services</a>
	<a target="_blank" href="https://github.com/RDCubing">GitHub</a>
</div>

<div class="page">

<h1>Downloads</h1>

<p>
Download the latest Geek Devs Community software.
This page always displays the newest version published through the update service.
</p>

<h2>Latest Release</h2>

<div class="panel">

<div class="download">

<div class="icon-box">
    <img src="neonstore.png" alt="NeonStore Icon">
</div>

<div>

<h3 id="title">Loading...</h3>

<p id="version"></p>

<p id="description"></p>

<a id="download" class="button" target="_blank">
Download
</a>

</div>

</div>

</div>

</div>

<div class="footer">
© 2026 Geek Devs Community<br>
Downloads
</div>

<script>

fetch("https://raw.githubusercontent.com/RDCubing/geekhubapi/main/update.json")
.then(r=>r.json())
.then(data=>{

const app=data.NeonStore ?? data;

document.getElementById("title").textContent=
app.Name || app.Title || "NeonStore";

document.getElementById("version").textContent=
"Version: " + (app.Version || "Unknown");

document.getElementById("description").textContent=
app.Description || "";

document.getElementById("download").href=
app.Download || app.DownloadUrl || app.Url;

})
.catch(()=>{

document.querySelector(".panel").innerHTML=
"<b>Unable to load release information.</b>";

});

</script>

</body>
</html>
